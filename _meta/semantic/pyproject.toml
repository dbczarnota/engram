[project]
name = "semantic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.6.0",
    "numpy>=2.4.6",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 110

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
